  <h2 class="modal-title">Forgot Password</h2>
  
  <p class="subtitle">
    No worries! Enter your email address below and we will send you a code to reset password.
  </p>

  <form [formGroup]="forgotPasswordForm" (ngSubmit)="sendResetInstruction()">
    
    <div class="form-group">
      <label class="form-label" for="email">E-mail</label>
      <input
        id="email"
        class="form-control"
        [class.input-error]="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched"
        type="email"
        placeholder="Email"
        formControlName="email"
      >
    </div>

    @if (successMessage()) {
      <div class="text-success">
        {{ successMessage() }}
      </div>
    }

    <button
      [disabled]="forgotPasswordForm.invalid"
      type="submit"
      class="btn-submit"
    >
      Send Reset Instruction
    </button>

     <div class="modal-footer">
      Non hai un account? <a routerLink="/landing/login" class="auth-link">Accedi</a>
    </div>

  </form>
</div>
