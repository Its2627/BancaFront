<div class="modal-backdrop" (click)="chiudi()"></div>

<div class="card-modal">
  <div class="pin-card-content">
    <button type="button" class="close-btn" (click)="chiudi()" aria-label="Chiudi">&times;</button>

    <!-- FASE 1: Inserimento Password -->
    <ng-container *ngIf="!pinMostrato">
      <h2>Inserisci Password</h2>
      <p class="subtitle">Inserisci la password del tuo account per visualizzare il PIN della carta.</p>

      <form (ngSubmit)="confermaPassword()">
        <div class="password-inputs">
          <input
            type="password"
            [(ngModel)]="password"
            name="password"
            placeholder="Inserisci password"
            required
            autofocus
          />
        </div>

        <div *ngIf="errore" class="error-msg">
          {{ errore }}
        </div>

        <div class="actions">
          <button type="button" class="btn-cancel" (click)="chiudi()">Annulla</button>
          <button type="submit" class="btn-confirm" [disabled]="loading || !password">
            {{ loading ? 'Verifica in corso...' : 'Conferma' }}
          </button>
        </div>
      </form>
    </ng-container>

    <!-- FASE 2: Visualizzazione PIN della carta -->
    <ng-container *ngIf="pinMostrato">
      <h2>PIN della Carta</h2>
      <p class="subtitle">Ecco il PIN associato alla tua carta:</p>

      <div class="pin-display-box">
        <span class="pin-code">{{ pinMostrato }}</span>
      </div>

      <div class="actions">
        <button type="button" class="btn-confirm" (click)="chiudi()">Chiudi</button>
      </div>
    </ng-container>
  </div>
</div>
